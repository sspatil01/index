<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Birthday Surprise</title>

<style>
  :root{
    --night-1:#150a2e;
    --night-2:#251242;
    --gold:#ffc857;
    --pink:#ff6f9c;
    --lilac:#c9b6ff;
    --cream:#fff6e9;
    --ink:#1c1030;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    background:radial-gradient(ellipse at top, var(--night-2), var(--night-1) 70%);
    color:var(--cream);
    font-family:Arial,Helvetica,sans-serif;
    overflow:hidden;
    -webkit-tap-highlight-color:transparent;
  }

  #stars{position:fixed;inset:0;z-index:0;}
  #balloon-layer{position:fixed;inset:0;z-index:0;pointer-events:none;}
  #sparkle-canvas{position:fixed;inset:0;z-index:1;pointer-events:none;}
  #confetti-canvas{position:fixed;inset:0;z-index:5;pointer-events:none;}

  .page{
    position:relative;z-index:2;
    height:100%;
    display:flex;justify-content:center;align-items:center;
    padding:20px;
    overflow-y:auto;
  }

  .container{
    width:100%;
    max-width:560px;
    background:rgba(255,255,255,0.07);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    padding:32px 28px;
    border-radius:22px;
    border:1px solid rgba(255,255,255,0.12);
    box-shadow:0 20px 50px rgba(0,0,0,.45);
  }

  .header-emoji{
    display:block;
    text-align:center;
    font-size:52px;
    animation:wiggle 2.6s ease-in-out infinite;
    filter:drop-shadow(0 8px 16px rgba(0,0,0,.35));
    margin-bottom:4px;
  }
  @keyframes wiggle{
    0%,100%{transform:rotate(0deg) translateY(0);}
    25%{transform:rotate(-6deg) translateY(-2px);}
    75%{transform:rotate(6deg) translateY(-2px);}
  }

  h1{
    text-align:center;
    margin:0 0 6px;
    font-size:clamp(20px,5vw,28px);
    color:var(--gold);
    text-shadow:0 0 16px rgba(255,200,87,.4);
  }
  .subtitle{
    text-align:center;
    margin:0 0 22px;
    font-size:13px;
    color:var(--lilac);
    opacity:.9;
  }

  label{
    display:block;
    font-size:13px;
    color:var(--lilac);
    margin-bottom:4px;
    margin-top:14px;
  }

  input,textarea{
    width:100%;
    padding:13px 14px;
    border:2px solid rgba(255,255,255,0.14);
    background:rgba(255,255,255,0.06);
    border-radius:12px;
    font-size:15px;
    color:var(--cream);
    outline:none;
    transition:border-color .2s ease, box-shadow .2s ease, background .2s ease;
    font-family:inherit;
    resize:vertical;
  }
  input::placeholder, textarea::placeholder{color:rgba(255,246,233,.45);}
  input:focus, textarea:focus{
    border-color:var(--gold);
    box-shadow:0 0 0 4px rgba(255,200,87,.15);
    background:rgba(255,255,255,0.09);
  }

  button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:999px;
    font-size:16px;
    font-weight:800;
    cursor:pointer;
    color:var(--ink);
    margin-top:20px;
    transition:transform .15s ease, box-shadow .2s ease;
  }
  button:active{transform:scale(.96);}

  #generateBtn{
    background:linear-gradient(135deg,var(--pink),var(--gold));
    box-shadow:0 10px 24px rgba(255,111,156,.35);
  }
  #generateBtn:hover{box-shadow:0 12px 30px rgba(255,111,156,.5);}

  #linkBox{
    margin-top:22px;
    word-break:break-all;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,.14);
    padding:18px;
    border-radius:14px;
    display:none;
    opacity:0;
    transform:translateY(10px);
    transition:opacity .4s ease, transform .4s ease;
  }
  #linkBox.show{display:block;}
  #linkBox.reveal{opacity:1;transform:translateY(0);}

  #generatedLink{
    font-size:14px;
    line-height:1.5;
  }
  #generatedLink a{color:var(--gold); text-decoration:none;}
  #generatedLink a:hover{text-decoration:underline;}

  .btn-row{
    display:flex;gap:10px;margin-top:14px;
  }
  .btn-row button{margin-top:0;flex:1;font-size:14px;padding:13px;}

  .copyBtn{
    background:linear-gradient(135deg,#00e6ac,#00c896);
    color:var(--ink);
  }
  .previewBtn{
    background:rgba(255,255,255,0.1);
    color:var(--cream);
    border:1px solid rgba(255,255,255,.25) !important;
  }

  .section-title{
    margin-top:22px;
    margin-bottom:4px;
    font-size:14px;
    font-weight:700;
    color:var(--gold);
  }
  .section-title .hint{
    font-weight:400;
    font-size:11px;
    color:var(--lilac);
    opacity:.85;
  }
  .upload-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-top:8px;
  }
  .upload-slot{
    background:rgba(255,255,255,0.05);
    border:1.5px dashed rgba(255,255,255,0.2);
    border-radius:12px;
    padding:8px;
    text-align:center;
  }
  .upload-label{
    display:block;
    font-size:11px;
    color:var(--lilac);
    margin-bottom:6px;
  }
  .upload-slot input[type="file"]{
    width:100%;
    font-size:10px;
    color:var(--cream);
    padding:0;
    border:none;
    background:none;
    margin-bottom:6px;
  }
  .thumb{
    display:none;
    width:100%;
    aspect-ratio:1/1;
    object-fit:cover;
    border-radius:8px;
    margin-top:4px;
  }
  .thumb.show{display:block;}
  .filename{
    font-size:10px;
    color:var(--lilac);
    opacity:.75;
    margin-top:4px;
    word-break:break-all;
  }
  input[type="file"]{
    width:100%;
    color:var(--cream);
    font-size:13px;
    padding:8px;
    border:1.5px dashed rgba(255,255,255,0.2);
    background:rgba(255,255,255,0.05);
    border-radius:10px;
    margin-top:6px;
    margin-bottom:4px;
  }
  .audio-preview{
    width:100%;
    height:36px;
    margin-top:4px;
    display:none;
  }
  .audio-preview.show{display:block;}

  #uploadChecklist{
    margin-top:16px;
    padding-top:14px;
    border-top:1px solid rgba(255,255,255,.12);
    font-size:12.5px;
    color:var(--lilac);
    line-height:1.7;
    text-align:left;
  }
  #uploadChecklist strong{color:var(--gold);}
  #uploadChecklist code{
    background:rgba(255,255,255,.1);
    padding:1px 6px;
    border-radius:6px;
    color:var(--cream);
  }

  #toast{
    position:fixed;
    left:50%;bottom:28px;
    transform:translateX(-50%) translateY(20px);
    background:linear-gradient(135deg,var(--gold),var(--pink));
    color:var(--ink);
    font-weight:800;
    padding:12px 22px;
    border-radius:999px;
    box-shadow:0 10px 24px rgba(0,0,0,.35);
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
    z-index:9;
    font-size:14px;
  }
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  /* balloons */
  .balloon{
    position:absolute;
    bottom:-140px;
    width:50px;height:64px;
    border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;
    pointer-events:auto;
    cursor:pointer;
    animation-name:float-up;
    animation-timing-function:ease-in;
    animation-iteration-count:infinite;
    filter:drop-shadow(0 6px 10px rgba(0,0,0,.35));
  }
  .balloon::after{
    content:"";
    position:absolute;left:50%;bottom:-30px;
    width:1px;height:30px;
    background:rgba(255,255,255,.35);
    transform:translateX(-50%);
  }
  .balloon.popped{animation:none !important; transform:scale(0); transition:transform .18s ease;}
  @keyframes float-up{
    0%{transform:translateY(0) translateX(0) rotate(-4deg);}
    50%{transform:translateY(-58vh) translateX(18px) rotate(4deg);}
    100%{transform:translateY(-118vh) translateX(-10px) rotate(-4deg);}
  }

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important;}
  }
</style>
</head>

<body>

<canvas id="stars"></canvas>
<div id="balloon-layer"></div>
<canvas id="sparkle-canvas"></canvas>
<canvas id="confetti-canvas"></canvas>

<div class="page">
  <div class="container">

    <span class="header-emoji">🎁</span>
    <h1>Birthday Surprise Creator</h1>
    <p class="subtitle">Fill this in and get a link to a personalized animated birthday card</p>

    <label for="name">Birthday person's name</label>
    <input type="text" id="name" placeholder="e.g. Gol Gappa">

    <label for="message">Your birthday message</label>
    <textarea id="message" rows="4" placeholder="Write your birthday message"></textarea>

    <div class="section-title">🖼️ Photos <span class="hint">(3 slots, optional)</span></div>
    <div class="upload-grid">
      <div class="upload-slot">
        <label class="upload-label" for="photo1">Photo 1</label>
        <input type="file" id="photo1" accept="image/*">
        <img class="thumb" id="thumb1" alt="">
        <div class="filename" id="fname1"></div>
      </div>
      <div class="upload-slot">
        <label class="upload-label" for="photo2">Photo 2</label>
        <input type="file" id="photo2" accept="image/*">
        <img class="thumb" id="thumb2" alt="">
        <div class="filename" id="fname2"></div>
      </div>
      <div class="upload-slot">
        <label class="upload-label" for="photo3">Photo 3</label>
        <input type="file" id="photo3" accept="image/*">
        <img class="thumb" id="thumb3" alt="">
        <div class="filename" id="fname3"></div>
      </div>
    </div>

    <div class="section-title">🎵 Audio <span class="hint">(optional — leave blank to use defaults)</span></div>

    <label class="upload-label" for="songFile">Birthday jingle (plays automatically)</label>
    <input type="file" id="songFile" accept="audio/*">
    <audio id="songPreview" class="audio-preview" controls></audio>
    <div class="filename" id="songName"></div>

    <label class="upload-label" for="surpriseFile">Surprise song (plays on tap)</label>
    <input type="file" id="surpriseFile" accept="audio/*">
    <audio id="surprisePreview" class="audio-preview" controls></audio>
    <div class="filename" id="surpriseName"></div>

    <button id="generateBtn" onclick="generateLink()">✨ Generate Birthday Link</button>

    <div id="linkBox">
      <div id="generatedLink"></div>
      <div class="btn-row">
        <button class="copyBtn" onclick="copyLink()">📋 Copy Link</button>
        <button class="previewBtn" onclick="previewLink()">👀 Preview</button>
      </div>
      <div id="uploadChecklist"></div>
    </div>

  </div>
</div>

<div id="toast">Link copied!</div>

<script>
(function(){
  // ---------- starfield ----------
  const starCanvas = document.getElementById('stars');
  const sctx = starCanvas.getContext('2d');
  let stars = [];
  function sizeCanvas(c){ c.width = window.innerWidth; c.height = window.innerHeight; }
  function initStars(){
    sizeCanvas(starCanvas);
    stars = [];
    const count = Math.floor((starCanvas.width*starCanvas.height)/9000);
    for(let i=0;i<count;i++){
      stars.push({
        x: Math.random()*starCanvas.width,
        y: Math.random()*starCanvas.height,
        r: Math.random()*1.4+0.3,
        p: Math.random()*Math.PI*2,
        s: Math.random()*0.02+0.01
      });
    }
  }
  function drawStars(t){
    sctx.clearRect(0,0,starCanvas.width,starCanvas.height);
    for(const st of stars){
      const alpha = 0.4 + 0.6*Math.sin(t*st.s + st.p)*0.5+0.3;
      sctx.beginPath();
      sctx.fillStyle = 'rgba(255,255,255,'+Math.max(0.15,alpha)+')';
      sctx.arc(st.x, st.y, st.r, 0, Math.PI*2);
      sctx.fill();
    }
    requestAnimationFrame(drawStars);
  }
  initStars();
  requestAnimationFrame(drawStars);
  window.addEventListener('resize', initStars);

  // ---------- balloons ----------
  const balloonLayer = document.getElementById('balloon-layer');
  const balloonColors = ['#ff6f9c','#ffc857','#7fd8be','#c9b6ff','#ff9d5c'];
  function spawnBalloon(){
    const b = document.createElement('div');
    b.className = 'balloon';
    const color = balloonColors[Math.floor(Math.random()*balloonColors.length)];
    b.style.background = 'radial-gradient(circle at 35% 30%, #fff8, '+color+' 60%)';
    b.style.left = (Math.random()*88)+'vw';
    const dur = 10 + Math.random()*6;
    b.style.animationDuration = dur+'s';
    b.style.animationDelay = (Math.random()*2)+'s';
    b.addEventListener('click', ()=> popBalloon(b));
    b.addEventListener('touchstart', ()=> popBalloon(b), {passive:true});
    balloonLayer.appendChild(b);
    setTimeout(()=>{ if(b.parentNode) b.remove(); }, (dur+2)*1000);
  }
  function popBalloon(b){
    if(b.classList.contains('popped')) return;
    b.classList.add('popped');
    const rect = b.getBoundingClientRect();
    burstConfettiAt(rect.left+rect.width/2, rect.top+rect.height/2, 14);
    setTimeout(()=> b.remove(), 200);
  }
  for(let i=0;i<4;i++) setTimeout(spawnBalloon, i*900);
  setInterval(spawnBalloon, 3200);

  // ---------- sparkle trail ----------
  const sparkCanvas = document.getElementById('sparkle-canvas');
  const spctx = sparkCanvas.getContext('2d');
  sizeCanvas(sparkCanvas);
  window.addEventListener('resize', ()=>sizeCanvas(sparkCanvas));
  let sparks = [];
  function addSpark(x,y){
    for(let i=0;i<3;i++){
      sparks.push({
        x, y,
        vx:(Math.random()-0.5)*1.6,
        vy:(Math.random()-0.5)*1.6 - 0.6,
        life:1,
        r: Math.random()*2+1,
        color: Math.random()<0.5 ? '#ffc857' : '#ff6f9c'
      });
    }
  }
  window.addEventListener('mousemove', e=>addSpark(e.clientX,e.clientY));
  window.addEventListener('touchmove', e=>{
    if(e.touches[0]) addSpark(e.touches[0].clientX, e.touches[0].clientY);
  }, {passive:true});
  function animSparks(){
    spctx.clearRect(0,0,sparkCanvas.width,sparkCanvas.height);
    sparks.forEach(s=>{
      s.x+=s.vx; s.y+=s.vy; s.life-=0.03;
      spctx.globalAlpha = Math.max(s.life,0);
      spctx.fillStyle = s.color;
      spctx.beginPath();
      spctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      spctx.fill();
    });
    spctx.globalAlpha = 1;
    sparks = sparks.filter(s=>s.life>0);
    requestAnimationFrame(animSparks);
  }
  animSparks();

  // ---------- confetti ----------
  const confCanvas = document.getElementById('confetti-canvas');
  const cctx = confCanvas.getContext('2d');
  sizeCanvas(confCanvas);
  window.addEventListener('resize', ()=>sizeCanvas(confCanvas));
  let confetti = [];
  const confColors = ['#ffc857','#ff6f9c','#c9b6ff','#7fd8be','#ff9d5c','#fff'];
  window.burstConfettiAt = function(x,y,count){
    for(let i=0;i<count;i++){
      const angle = Math.random()*Math.PI*2;
      const speed = Math.random()*5+2;
      confetti.push({
        x,y,
        vx:Math.cos(angle)*speed,
        vy:Math.sin(angle)*speed - 2,
        rot:Math.random()*360,
        vr:(Math.random()-0.5)*10,
        size:Math.random()*6+4,
        color:confColors[Math.floor(Math.random()*confColors.length)],
        life:1
      });
    }
  };
  function burstConfettiAt(x,y,count){ window.burstConfettiAt(x,y,count); }
  function confettiCannon(){
    const w = confCanvas.width;
    burstConfettiAt(w*0.2, confCanvas.height*0.85, 60);
    burstConfettiAt(w*0.8, confCanvas.height*0.85, 60);
    burstConfettiAt(w*0.5, confCanvas.height*0.6, 40);
  }
  function animConfetti(){
    cctx.clearRect(0,0,confCanvas.width,confCanvas.height);
    confetti.forEach(c=>{
      c.vy += 0.12;
      c.x += c.vx; c.y += c.vy; c.rot += c.vr;
      c.life -= 0.006;
      cctx.save();
      cctx.translate(c.x,c.y);
      cctx.rotate(c.rot*Math.PI/180);
      cctx.globalAlpha = Math.max(c.life,0);
      cctx.fillStyle = c.color;
      cctx.fillRect(-c.size/2,-c.size/4,c.size,c.size/2);
      cctx.restore();
    });
    confetti = confetti.filter(c=>c.life>0 && c.y < confCanvas.height+50);
    requestAnimationFrame(animConfetti);
  }
  animConfetti();
  window.__confettiCannon = confettiCannon;
})();

// ---------- live previews for uploaded files ----------
function setupImagePreview(inputId, thumbId, fnameId){
  const input = document.getElementById(inputId);
  const thumb = document.getElementById(thumbId);
  const fname = document.getElementById(fnameId);
  input.addEventListener('change', ()=>{
    const f = input.files[0];
    if(!f){ thumb.classList.remove('show'); fname.textContent=''; return; }
    thumb.src = URL.createObjectURL(f);
    thumb.classList.add('show');
    fname.textContent = f.name;
  });
}
function setupAudioPreview(inputId, audioId, fnameId){
  const input = document.getElementById(inputId);
  const audioEl = document.getElementById(audioId);
  const fname = document.getElementById(fnameId);
  input.addEventListener('change', ()=>{
    const f = input.files[0];
    if(!f){ audioEl.classList.remove('show'); audioEl.removeAttribute('src'); fname.textContent=''; return; }
    audioEl.src = URL.createObjectURL(f);
    audioEl.classList.add('show');
    fname.textContent = f.name;
  });
}
setupImagePreview('photo1','thumb1','fname1');
setupImagePreview('photo2','thumb2','fname2');
setupImagePreview('photo3','thumb3','fname3');
setupAudioPreview('songFile','songPreview','songName');
setupAudioPreview('surpriseFile','surprisePreview','surpriseName');

// ---------- form logic ----------
let lastLink = "";

function pickedFileName(inputId, fallback){
  const f = document.getElementById(inputId).files[0];
  return f ? f.name : null; // null means "use default, no upload needed"
}

function generateLink(){

  let nameVal = document.getElementById("name").value;
  let msgVal = document.getElementById("message").value;

  let name = encodeURIComponent(nameVal);
  let msg = encodeURIComponent(msgVal);

  let base =
    window.location.origin +
    window.location.pathname.replace("index.html", "");

  const photo1 = pickedFileName('photo1');
  const photo2 = pickedFileName('photo2');
  const photo3 = pickedFileName('photo3');
  const song = pickedFileName('songFile');
  const surprise = pickedFileName('surpriseFile');

  let link = base + "card.html?name=" + name + "&msg=" + msg;
  const toUpload = [];

  if(photo1){ link += "&photo1=" + encodeURIComponent("photos/"+photo1); toUpload.push({slot:'Photo 1', file:photo1, folder:'photos'}); }
  if(photo2){ link += "&photo2=" + encodeURIComponent("photos/"+photo2); toUpload.push({slot:'Photo 2', file:photo2, folder:'photos'}); }
  if(photo3){ link += "&photo3=" + encodeURIComponent("photos/"+photo3); toUpload.push({slot:'Photo 3', file:photo3, folder:'photos'}); }
  if(song){ link += "&song=" + encodeURIComponent("audio/"+song); toUpload.push({slot:'Birthday jingle', file:song, folder:'audio'}); }
  if(surprise){ link += "&surprise=" + encodeURIComponent("audio/"+surprise); toUpload.push({slot:'Surprise song', file:surprise, folder:'audio'}); }

  lastLink = link;

  document.getElementById("generatedLink").innerHTML =
    '<a href="' + link + '" target="_blank">' + link + '</a>';

  const checklistEl = document.getElementById("uploadChecklist");
  if(toUpload.length){
    let html = '<strong>Before sharing, upload these files to your repo:</strong><br>';
    toUpload.forEach(u=>{
      html += '• ' + u.slot + ' → <code>' + u.folder + '/' + u.file + '</code><br>';
    });
    html += 'Use the exact filenames shown above (capitalization matters on GitHub Pages).';
    checklistEl.innerHTML = html;
  } else {
    checklistEl.innerHTML = '<strong>No files selected</strong> — this link will automatically use whatever photos and songs are already sitting in your repo\'s <code>photos/</code> and <code>audio/</code> folders, no matter what they\'re named.';
  }

  const box = document.getElementById("linkBox");
  box.classList.add("show");
  requestAnimationFrame(()=> box.classList.add("reveal"));

  if(window.__confettiCannon) window.__confettiCannon();
  box.scrollIntoView({behavior:"smooth", block:"nearest"});
}

function copyLink(){
  navigator.clipboard.writeText(lastLink || document.getElementById("generatedLink").innerText)
    .then(showToast)
    .catch(showToast);
}

function previewLink(){
  if(lastLink) window.open(lastLink, "_blank");
}

function showToast(){
  const toast = document.getElementById("toast");
  toast.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=> toast.classList.remove("show"), 1800);
}
</script>

</body>
</html>
