<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover" />
<title>Birthday Surprise</title>
<style>
  :root{
    --night-1:#150a2e;
    --night-2:#251242;
    --gold:#ffc857;
    --pink:#ff6f9c;
    --lilac:#c9b6ff;
    --cream:#fff6e9;
    --ink:#1c1030;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    background:radial-gradient(ellipse at top, var(--night-2), var(--night-1) 70%);
    color:var(--cream);
    font-family:'Nunito',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    overflow:hidden;
    -webkit-tap-highlight-color:transparent;
    touch-action: manipulation;
  }
  @font-face{
    /* graceful fallback if fonts don't load */
  }
  #stars{position:fixed;inset:0;z-index:0;}
  .scene{
    position:fixed;inset:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:18px;
    opacity:0;visibility:hidden;pointer-events:none;
    transition:opacity .6s ease;
    z-index:2;
    padding:24px;
    text-align:center;
  }
  .scene.active{opacity:1;visibility:visible;pointer-events:auto;}

  h1.name{
    font-family:'Baloo 2','Nunito',sans-serif;
    font-weight:800;
    font-size:clamp(28px,7vw,44px);
    margin:0;
    color:var(--gold);
    text-shadow:0 0 18px rgba(255,200,87,.5);
  }
  p.tagline{
    margin:0;
    font-size:15px;
    letter-spacing:.02em;
    color:var(--lilac);
    opacity:.9;
  }

  /* ---- Balloons ---- */
  #balloon-layer{position:fixed;inset:0;z-index:1;pointer-events:none;}
  .balloon{
    position:absolute;
    bottom:-140px;
    width:56px;height:70px;
    border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;
    pointer-events:auto;
    cursor:pointer;
    animation-name:float-up;
    animation-timing-function:ease-in;
    animation-iteration-count:infinite;
    filter:drop-shadow(0 6px 10px rgba(0,0,0,.35));
  }
  .balloon::after{
    content:"";
    position:absolute;left:50%;bottom:-34px;
    width:1px;height:34px;
    background:rgba(255,255,255,.35);
    transform:translateX(-50%);
  }
  .balloon.popped{animation:none !important; transform:scale(0); transition:transform .18s ease;}
  @keyframes float-up{
    0%{transform:translateY(0) translateX(0) rotate(-4deg);}
    50%{transform:translateY(-58vh) translateX(18px) rotate(4deg);}
    100%{transform:translateY(-118vh) translateX(-10px) rotate(-4deg);}
  }

  /* ---- Gift scene ---- */
  #gift-wrap{
    cursor:pointer;
    position:relative;
    animation:wiggle 2.6s ease-in-out infinite;
    filter:drop-shadow(0 10px 24px rgba(0,0,0,.4));
  }
  @keyframes wiggle{
    0%,100%{transform:rotate(0deg) translateY(0);}
    25%{transform:rotate(-4deg) translateY(-2px);}
    75%{transform:rotate(4deg) translateY(-2px);}
  }
  #gift-wrap:active{animation:none;transform:scale(.94);}
  .gift-emoji{font-size:min(28vw,150px);line-height:1;display:block;}
  .tap-hint{
    font-size:14px;color:var(--lilac);
    animation:pulse-op 1.6s ease-in-out infinite;
  }
  @keyframes pulse-op{0%,100%{opacity:.5;}50%{opacity:1;}}

  .burst-ring{
    position:absolute;left:50%;top:50%;
    width:10px;height:10px;
    border-radius:50%;
    border:3px solid var(--gold);
    transform:translate(-50%,-50%) scale(0);
    opacity:0;
    pointer-events:none;
  }
  .burst-ring.go{
    animation:ring-out .7s ease-out forwards;
  }
  @keyframes ring-out{
    0%{transform:translate(-50%,-50%) scale(0);opacity:1;}
    100%{transform:translate(-50%,-50%) scale(18);opacity:0;}
  }

  /* ---- Cake / candles scene ---- */
  #cake-emoji{font-size:min(30vw,160px);position:relative;display:inline-block;}
  #candle-row{display:flex;gap:14px;justify-content:center;margin-top:-14px;}
  .candle{
    position:relative;
    width:8px;height:34px;
    background:linear-gradient(var(--pink),#ffb3c9);
    border-radius:3px;
    cursor:pointer;
  }
  .flame{
    position:absolute;top:-16px;left:50%;
    width:12px;height:18px;
    transform:translateX(-50%);
    background:radial-gradient(circle at 50% 70%, #fff6c8, var(--gold) 55%, #ff8a3d 90%);
    border-radius:50% 50% 50% 50% / 65% 65% 35% 35%;
    animation:flicker 0.45s ease-in-out infinite alternate;
    transform-origin:bottom center;
  }
  @keyframes flicker{
    0%{transform:translateX(-50%) scale(1) rotate(-3deg);}
    100%{transform:translateX(-50%) scale(1.12) rotate(3deg);}
  }
  .candle.blown .flame{display:none;}
  .smoke{
    position:absolute;top:-18px;left:50%;
    width:6px;height:6px;border-radius:50%;
    background:rgba(255,255,255,.55);
    transform:translateX(-50%);
    animation:smoke-up .9s ease-out forwards;
    pointer-events:none;
  }
  @keyframes smoke-up{
    0%{opacity:.8;transform:translate(-50%,0) scale(1);}
    100%{opacity:0;transform:translate(-50%,-40px) scale(3);}
  }
  #blow-hint{font-size:14px;color:var(--lilac);}

  /* ---- Message scene ---- */
  #msg-box{max-width:520px;}
  #typed-msg{
    font-size:clamp(17px,4vw,22px);
    line-height:1.5;
    min-height:3.2em;
    color:var(--cream);
  }
  #typed-msg .cursor{
    display:inline-block;width:2px;height:1em;background:var(--gold);
    margin-left:2px;vertical-align:-2px;
    animation:blink 1s step-end infinite;
  }
  @keyframes blink{50%{opacity:0;}}

  /* photo stack */
  #photo-stack{
    position:relative;
    width:min(72vw,260px);height:min(72vw,260px);
    margin:10px auto 4px;
    perspective:1000px;
  }
  .photo-card{
    position:absolute;inset:0;
    border-radius:16px;
    overflow:hidden;
    border:4px solid rgba(255,255,255,.85);
    box-shadow:0 14px 30px rgba(0,0,0,.45);
    background:#000;
    cursor:grab;
    transition:transform .35s cubic-bezier(.2,.8,.2,1), opacity .35s ease;
    user-select:none;
    -webkit-user-drag:none;
  }
  .photo-card img{width:100%;height:100%;object-fit:cover;pointer-events:none;display:block;}
  .photo-hint{font-size:12px;color:var(--lilac);opacity:.8;}

  .replay-btn{
    margin-top:8px;
    background:linear-gradient(135deg,var(--pink),var(--gold));
    color:var(--ink);
    border:none;
    padding:12px 22px;
    border-radius:999px;
    font-weight:800;
    font-size:15px;
    cursor:pointer;
    box-shadow:0 8px 20px rgba(255,111,156,.35);
    transition:transform .15s ease;
  }
  .replay-btn:active{transform:scale(.95);}

  /* music toggle */
  #music-toggle{
    position:fixed;bottom:18px;right:18px;z-index:5;
    width:52px;height:52px;border-radius:50%;
    background:rgba(255,255,255,.12);
    backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,.25);
    color:var(--cream);
    font-size:22px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
  }
  #music-toggle.playing{animation:spin 3s linear infinite;}
  @keyframes spin{100%{transform:rotate(360deg);}}

  #confetti-canvas{position:fixed;inset:0;z-index:6;pointer-events:none;}
  #sparkle-canvas{position:fixed;inset:0;z-index:4;pointer-events:none;}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important;}
  }
</style>
</head>
<body>

<canvas id="stars"></canvas>
<div id="balloon-layer"></div>
<canvas id="sparkle-canvas"></canvas>
<canvas id="confetti-canvas"></canvas>

<!-- Scene 1: Gift -->
<section class="scene active" id="scene-gift">
  <h1 class="name" id="name-label-1">Hey there</h1>
  <div id="gift-wrap">
    <span class="gift-emoji">🎁</span>
    <div class="burst-ring" id="giftRing"></div>
  </div>
  <p class="tap-hint">Tap the gift</p>
</section>

<!-- Scene 2: Cake / candles -->
<section class="scene" id="scene-cake">
  <div>
    <div id="cake-emoji">🎂</div>
    <div id="candle-row"></div>
  </div>
  <p id="blow-hint">Tap each candle to blow it out</p>
</section>

<!-- Scene 3: Message + photos -->
<section class="scene" id="scene-message">
  <h1 class="name" id="name-label-2">Friend</h1>
  <div id="msg-box">
    <p id="typed-msg"><span class="cursor"></span></p>
  </div>
  <div id="photo-stack"></div>
  <p class="photo-hint">Swipe or tap the photos</p>
  <button class="replay-btn" id="replayBtn">🎉 Replay Celebration</button>
  <audio id="bgAudio" src="audio/birthday.mp3" loop preload="auto"></audio>
</section>

<button id="music-toggle" title="Toggle music">🎵</button>

<script>
(function(){
  // ---------- read query params ----------
  const params = new URLSearchParams(window.location.search);
  const name = (params.get('name') || 'Friend').trim() || 'Friend';
  const msg = (params.get('msg') || 'Wishing you a very Happy Birthday!').trim();

  document.getElementById('name-label-1').textContent = 'Hey ' + name + ' 🎈';
  document.getElementById('name-label-2').textContent = name + ' 🎂';

  const photoFiles = ['images/photo1.jpg','images/photo2.jpg','images/photo3.jpg'];

  // ---------- starfield ----------
  const starCanvas = document.getElementById('stars');
  const sctx = starCanvas.getContext('2d');
  let stars = [];
  function sizeCanvas(c){ c.width = window.innerWidth; c.height = window.innerHeight; }
  function initStars(){
    sizeCanvas(starCanvas);
    stars = [];
    const count = Math.floor((starCanvas.width*starCanvas.height)/9000);
    for(let i=0;i<count;i++){
      stars.push({
        x: Math.random()*starCanvas.width,
        y: Math.random()*starCanvas.height,
        r: Math.random()*1.4+0.3,
        p: Math.random()*Math.PI*2,
        s: Math.random()*0.02+0.01
      });
    }
  }
  function drawStars(t){
    sctx.clearRect(0,0,starCanvas.width,starCanvas.height);
    for(const st of stars){
      const alpha = 0.4 + 0.6*Math.sin(t*st.s + st.p)*0.5+0.3;
      sctx.beginPath();
      sctx.fillStyle = 'rgba(255,255,255,'+Math.max(0.15,alpha)+')';
      sctx.arc(st.x, st.y, st.r, 0, Math.PI*2);
      sctx.fill();
    }
    requestAnimationFrame(drawStars);
  }
  initStars();
  requestAnimationFrame(drawStars);
  window.addEventListener('resize', initStars);

  // ---------- balloons ----------
  const balloonLayer = document.getElementById('balloon-layer');
  const balloonColors = ['#ff6f9c','#ffc857','#7fd8be','#c9b6ff','#ff9d5c'];
  function spawnBalloon(){
    const b = document.createElement('div');
    b.className = 'balloon';
    const color = balloonColors[Math.floor(Math.random()*balloonColors.length)];
    b.style.background = 'radial-gradient(circle at 35% 30%, #fff8, '+color+' 60%)';
    b.style.left = (Math.random()*88)+'vw';
    const dur = 9 + Math.random()*6;
    b.style.animationDuration = dur+'s';
    b.style.animationDelay = (Math.random()*2)+'s';
    b.addEventListener('click', ()=> popBalloon(b));
    b.addEventListener('touchstart', (e)=>{ popBalloon(b); }, {passive:true});
    balloonLayer.appendChild(b);
    setTimeout(()=>{ if(b.parentNode) b.remove(); }, (dur+2)*1000);
  }
  function popBalloon(b){
    if(b.classList.contains('popped')) return;
    b.classList.add('popped');
    const rect = b.getBoundingClientRect();
    burstConfettiAt(rect.left+rect.width/2, rect.top+rect.height/2, 16);
    setTimeout(()=> b.remove(), 200);
  }
  for(let i=0;i<6;i++) setTimeout(spawnBalloon, i*700);
  setInterval(spawnBalloon, 2600);

  // ---------- sparkle trail ----------
  const sparkCanvas = document.getElementById('sparkle-canvas');
  const spctx = sparkCanvas.getContext('2d');
  sizeCanvas(sparkCanvas);
  window.addEventListener('resize', ()=>sizeCanvas(sparkCanvas));
  let sparks = [];
  function addSpark(x,y){
    for(let i=0;i<3;i++){
      sparks.push({
        x, y,
        vx:(Math.random()-0.5)*1.6,
        vy:(Math.random()-0.5)*1.6 - 0.6,
        life:1,
        r: Math.random()*2+1,
        color: Math.random()<0.5 ? '#ffc857' : '#ff6f9c'
      });
    }
  }
  function pointerMove(x,y){ addSpark(x,y); }
  window.addEventListener('mousemove', e=>pointerMove(e.clientX,e.clientY));
  window.addEventListener('touchmove', e=>{
    if(e.touches[0]) pointerMove(e.touches[0].clientX, e.touches[0].clientY);
  }, {passive:true});
  function animSparks(){
    spctx.clearRect(0,0,sparkCanvas.width,sparkCanvas.height);
    sparks.forEach(s=>{
      s.x+=s.vx; s.y+=s.vy; s.life-=0.03;
      spctx.globalAlpha = Math.max(s.life,0);
      spctx.fillStyle = s.color;
      spctx.beginPath();
      spctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      spctx.fill();
    });
    spctx.globalAlpha = 1;
    sparks = sparks.filter(s=>s.life>0);
    requestAnimationFrame(animSparks);
  }
  animSparks();

  // ---------- confetti ----------
  const confCanvas = document.getElementById('confetti-canvas');
  const cctx = confCanvas.getContext('2d');
  sizeCanvas(confCanvas);
  window.addEventListener('resize', ()=>sizeCanvas(confCanvas));
  let confetti = [];
  const confColors = ['#ffc857','#ff6f9c','#c9b6ff','#7fd8be','#ff9d5c','#fff'];
  function burstConfettiAt(x,y,count){
    for(let i=0;i<count;i++){
      const angle = Math.random()*Math.PI*2;
      const speed = Math.random()*5+2;
      confetti.push({
        x,y,
        vx:Math.cos(angle)*speed,
        vy:Math.sin(angle)*speed - 2,
        rot:Math.random()*360,
        vr:(Math.random()-0.5)*10,
        size:Math.random()*6+4,
        color:confColors[Math.floor(Math.random()*confColors.length)],
        life:1
      });
    }
  }
  function confettiCannon(){
    const w = confCanvas.width;
    burstConfettiAt(w*0.2, confCanvas.height*0.9, 60);
    burstConfettiAt(w*0.8, confCanvas.height*0.9, 60);
    burstConfettiAt(w*0.5, confCanvas.height*0.7, 40);
  }
  function animConfetti(){
    cctx.clearRect(0,0,confCanvas.width,confCanvas.height);
    confetti.forEach(c=>{
      c.vy += 0.12;
      c.x += c.vx; c.y += c.vy; c.rot += c.vr;
      c.life -= 0.006;
      cctx.save();
      cctx.translate(c.x,c.y);
      cctx.rotate(c.rot*Math.PI/180);
      cctx.globalAlpha = Math.max(c.life,0);
      cctx.fillStyle = c.color;
      cctx.fillRect(-c.size/2,-c.size/4,c.size,c.size/2);
      cctx.restore();
    });
    confetti = confetti.filter(c=>c.life>0 && c.y < confCanvas.height+50);
    requestAnimationFrame(animConfetti);
  }
  animConfetti();

  // ---------- scene management ----------
  const scenes = {
    gift: document.getElementById('scene-gift'),
    cake: document.getElementById('scene-cake'),
    message: document.getElementById('scene-message')
  };
  function showScene(key){
    Object.values(scenes).forEach(s=>s.classList.remove('active'));
    scenes[key].classList.add('active');
  }

  // ---------- gift open ----------
  const giftWrap = document.getElementById('gift-wrap');
  const giftRing = document.getElementById('giftRing');
  giftWrap.addEventListener('click', openGift);
  function openGift(){
    giftRing.classList.add('go');
    burstConfettiAt(window.innerWidth/2, window.innerHeight/2, 30);
    setTimeout(()=>{
      showScene('cake');
      buildCandles();
    }, 450);
  }

  // ---------- candles ----------
  const candleRow = document.getElementById('candle-row');
  let candlesLeft = 0;
  function buildCandles(){
    candleRow.innerHTML = '';
    const n = 5;
    candlesLeft = n;
    for(let i=0;i<n;i++){
      const c = document.createElement('div');
      c.className = 'candle';
      c.innerHTML = '<div class="flame"></div>';
      c.addEventListener('click', ()=>blowCandle(c));
      candleRow.appendChild(c);
    }
  }
  function blowCandle(c){
    if(c.classList.contains('blown')) return;
    c.classList.add('blown');
    const smoke = document.createElement('div');
    smoke.className = 'smoke';
    c.appendChild(smoke);
    candlesLeft--;
    if(candlesLeft<=0){
      setTimeout(()=>{
        showScene('message');
        startMessageScene();
      }, 500);
    }
  }

  // ---------- typewriter ----------
  const typedEl = document.getElementById('typed-msg');
  let typeTimer = null;
  function typeMessage(){
    clearTimeout(typeTimer);
    typedEl.innerHTML = '<span class="cursor"></span>';
    const full = msg;
    let i = 0;
    function step(){
      if(i<=full.length){
        typedEl.innerHTML = full.slice(0,i) + '<span class="cursor"></span>';
        i++;
        typeTimer = setTimeout(step, 35);
      }
    }
    step();
  }

  // ---------- photo stack ----------
  const stack = document.getElementById('photo-stack');
  let order = [0,1,2];
  function renderStack(){
    stack.innerHTML = '';
    order.forEach((idx, pos) => {
      const card = document.createElement('div');
      card.className = 'photo-card';
      const depth = pos;
      card.style.zIndex = 10-pos;
      card.style.transform = 'translateY('+(depth*10)+'px) scale('+(1-depth*0.06)+') rotate('+((depth%2?1:-1)*depth*2)+'deg)';
      card.style.opacity = depth>2 ? 0 : 1;
      const img = document.createElement('img');
      img.src = photoFiles[idx];
      img.alt = 'memory photo';
      img.onerror = function(){ card.style.display='none'; };
      card.appendChild(img);
      if(pos===0){
        card.style.cursor='grab';
        let startX=0, dragging=false;
        const cycle = ()=>{ order.push(order.shift()); renderStack(); burstConfettiAt(window.innerWidth/2, window.innerHeight*0.45, 10); };
        card.addEventListener('click', cycle);
        card.addEventListener('touchstart', e=>{ startX = e.touches[0].clientX; dragging=true; }, {passive:true});
        card.addEventListener('touchend', e=>{
          if(!dragging) return;
          const endX = e.changedTouches[0].clientX;
          if(Math.abs(endX-startX) > 40) cycle();
          dragging=false;
        });
      }
      stack.appendChild(card);
    });
  }

  function startMessageScene(){
    renderStack();
    typeMessage();
  }

  // ---------- replay ----------
  document.getElementById('replayBtn').addEventListener('click', ()=>{
    confettiCannon();
    setTimeout(()=>{
      showScene('gift');
    }, 900);
  });

  // ---------- music ----------
  const audio = document.getElementById('bgAudio');
  const musicBtn = document.getElementById('music-toggle');
  let playing = false;
  musicBtn.addEventListener('click', ()=>{
    if(playing){
      audio.pause();
      musicBtn.classList.remove('playing');
      musicBtn.textContent = '🎵';
    } else {
      audio.play().catch(()=>{});
      musicBtn.classList.add('playing');
      musicBtn.textContent = '🎶';
    }
    playing = !playing;
  });

  // start music quietly once user interacts with gift, best-effort
  giftWrap.addEventListener('click', ()=>{
    if(!playing){
      audio.play().then(()=>{
        playing = true;
        musicBtn.classList.add('playing');
        musicBtn.textContent = '🎶';
      }).catch(()=>{});
    }
  }, { once:true });

})();
</script>
</body>
</html>
